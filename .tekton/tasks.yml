apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace before a new pipeline run
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace $(workspaces.source.path)"
        rm -rf $(workspaces.source.path)/* $(workspaces.source.path)/.[!.]* 2>/dev/null || true
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run the unit tests with nose
  workspaces:
    - name: source
  params:
    - name: args
      description: Extra arguments for nosetests
      type: string
      default: "-v --with-spec --spec-color"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        python -m pip install --quiet --upgrade pip wheel
        pip install --quiet -r requirements.txt
        nosetests $(params.args)
